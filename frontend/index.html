<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini SOC Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛡️ Mini SOC</h1>
        <p>Security Operations Center Dashboard</p>
    </header>

    <main>

        <section class="stats">

            <div class="card">
                <h3>Total Alerts</h3>
                <p id="total-alerts">0</p>
            </div>

            <div class="card">
                <h3>High</h3>
                <p id="high-alerts">0</p>
            </div>

            <div class="card">
                <h3>Medium</h3>
                <p id="medium-alerts">0</p>
            </div>

            <div class="card">
                <h3>Low</h3>
                <p id="low-alerts">0</p>
            </div>

        </section>


        <section class="alerts-section">

            <h2>Recent Security Alerts</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Rule</th>
                        <th>Severity</th>
                        <th>Source IP</th>
                        <th>Attempts</th>
                        <th>MITRE</th>
                    </tr>
                </thead>

                <tbody id="alerts-table">
                </tbody>

            </table>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
